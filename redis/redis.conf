# Redis endurecido (montado como solo lectura en el contenedor)
bind 0.0.0.0
protected-mode yes
appendonly yes
# La contraseña se pasa por --requirepass en el command (desde .env)

# Deshabilitar comandos peligrosos
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN SHUTDOWN_DISABLED
rename-command SLAVEOF ""
rename-command REPLICAOF ""
